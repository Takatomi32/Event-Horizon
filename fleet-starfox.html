<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Fox Fleet | Event Horizon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="fleet-page">

  <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="models.html">Hangar</a></li>
                <li class="active-fleet">STAR FOX COMMAND</li>
            </ul>
        </div>
    </nav>

  <div class="fleet-layout">
        <aside class="ship-sidebar">
            <div class="sidebar-header">
                <h2>STAR FOX FLEET</h2>
            </div>

          <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('arwing_mk1.glb', 'ARWING MK I', 'The original Arspace Dynamics interceptor. Fast and agile, but lacks heavy armor. A favorite among mercenaries for its reliable G-Diffuser system.')">
                    <span class="btn-text">ARWING MK I</span>
                </button>

            <button class="ship-btn" onclick="updateModel('arwing_mk2.glb', 'ARWING MK II', 'A high-performance successor to the MK I. Developed for the StarFox team when they commisioned Aerospace Dynamics, replacing the MK I.')">
                    <span class="btn-text">ARWING MK II</span>
                </button>

            <button class="ship-btn" onclick="updateModel('arwing_mk2_b.glb', 'ARWING MK II Retrofit', 'A custom X-02b variant engineered by Slippy Toad. Despite superior modifications, the craft suffers from hardware degradation.')">
                    <span class="btn-text">ARWING MK II Retrofit</span>
                </button>

            <button class="ship-btn" onclick="updateModel('arwing_mk3.glb', 'ARWING MK III', 'The pinnacle of Arspace Dynamics engineering. Built using data from the Phoenix arwing.')">
                    <span class="btn-text">ARWING MK III</span>
                </button>

              <button class="ship-btn" onclick="updateModel('arwing_phoenix.glb', 'ARWING PHOENIX', 'An experimental stunt-class Arwing variant. Known for its unique gliding capabilities.')">
                    <span class="btn-text">ARWING PHOENIX</span>
                </button>

              <button class="ship-btn" onclick="updateModel('miyu_arwing.glb', 'ARWING INTERCEPTOR', 'A lightweight post-war model optimized for speed. Boasts superior maneuverability.')">
                    <span class="btn-text">ARWING INTERCEPTOR</span>
                </button>

              <button class="ship-btn" onclick="updateModel('fay_arwing.glb', 'ARMORED ARWING', 'A rare, high-acceleration Interceptor variant. trades armor plating for unparalleled maneuverability.')">
                    <span class="btn-text">ARMORED ARWING</span>
                </button>

              <button class="ship-btn" onclick="updateModel('skyclaw.glb', 'ARWING SKYCLAW', 'Falcos specialized MK III. Achieving the highest thrust-to-weight ratio in the Star Fox fleet.')">
                    <span class="btn-text">ARWING SKYCLAW</span>
                </button>

              <button class="ship-btn" onclick="updateModel('cloudrunner.glb', 'ARWING CLOUDRUNNER', 'Krystals personalized MK III. This unit sacrifices maneuverability for superior defensive plating.')">
                    <span class="btn-text">ARWING CLOUDRUNNER</span>
                </button>

              <button class="ship-btn" onclick="updateModel('landmaster.glb', 'LANDMASTER', 'A heavy-armored ground combat vehicle. Features high-caliber firepower and a G-Diffuser for surprising agility. Developed by SLippy Toad.')">
                    <span class="btn-text">LANDMASTER</span>
                </button>

              <button class="ship-btn" onclick="updateModel('bluemarine.glb', 'BLUEMARINE', 'A heavy assault submarine engineered for deep-sea combat. Reinforced hull and specialized Aquan weaponry. Developed by Slippy Toad.')">
                    <span class="btn-text">BLUEMARINE</span>
                </button>

              <button class="ship-btn" onclick="updateModel('gf_64.glb', 'GREAT FOX 64', 'A Dreadnought-class Heavy Cruiser and the base of operations for Star Fox.')">
                    <span class="btn-text">GREAT FOX 64</span>
                </button>

              <button class="ship-btn" onclick="updateModel('gf_adv.glb', 'GREAT FOX ADVENTURES', 'Superior modifications from the original version, but suffers from. degradation')">
                    <span class="btn-text">GREAT FOX ADVENTURES</span>
                </button>

              <button class="ship-btn" onclick="updateModel('gf_assault.glb', 'GREAT FOX ASSAULT', 'A modernized refit of the Star Fox dreadnought. Best during the Aparoid Invasion.')">
                    <span class="btn-text">GREAT FOX ASSAULT</span>
                </button>

              <button class="ship-btn" onclick="updateModel('gf_command.glb', 'GREAT FOX COMMAND', 'After the events from the Aparoid Invasion, the team comissioned the manufacturers to develop one new Great Fox. Best used during the Anglar invasion.')">
                    <span class="btn-text">GREAT FOX COMMAND</span>
                </button>
              
            <a href="models.html" class="back-btn">« RETURN TO HANGAR</a>
              </aside>

      <main class="viewer-section">
            <model-viewer id="main-display" 
                src="sf_models/arwing_mk1.glb" 
                auto-rotate camera-controls 
                shadow-intensity="1" 
                exposure="1.2">
            </model-viewer>

          <div class="ship-description-box">
                <h1 id="ship-name">ARWING MK I</h1>
                <p id="ship-desc">The legendary interceptor that saved the Lylat System. Versatile and agile.</p>
            </div>
        </main>
    </div>

  <script>
        function updateModel(fileName, name, desc) {
            const viewer = document.getElementById('main-display');
            viewer.src = `sf_models/${fileName}`;
            document.getElementById('ship-name').innerText = name;
            document.getElementById('ship-desc').innerText = desc;
            
            // Handle active button state
            document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
