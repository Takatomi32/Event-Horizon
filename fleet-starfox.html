<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StarFox Fleet | Event Horizon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body class="fleet-page starfox-theme">

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="models.html">Hangar</a></li>
                <li class="active-fleet">STAR FOX COMMAND</li>
            </ul>
        </div>
    </nav>

  <div class="fleet-layout">
        <aside class="ship-menu">
            <div class="faction-header">
                <img src="sf_logo.png" class="menu-faction-logo">
                <h2>STARFOX FLEET</h2>
            </div>

          <div class="ship-list">
            <button class="ship-btn active" onclick="updateModel('arwing_mk1.glb', 'ARWING MK I', 'The classic Lylat interceptor.')">
                <img src="starfox_thumb/arwing_mk1_thumb.png" class="btn-img-thumb">
                <span class="btn-text">ARWING MK I</span>
            </button>
            </div>
    </aside>
      
      <main class="viewer-container">
        <model-viewer id="main-display" 
            src="sf_models/arwing_mk1.glb" 
            auto-rotate camera-controls 
            exposure="1.2"
            shadow-intensity="1">
        </model-viewer>
        
        <div class="ship-data-overlay">
            <h1 id="ship-name">ARWING MK I</h1>
            <p id="ship-desc">The classic Lylat interceptor.</p>
        </div>
    </main>
</div>

            <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('sf_models/arwing_mk2.glb', 'arwing_mk2', 'The standard-setting interceptor for Team Star Fox. Features integrated G-Diffuser technology.')">
                    <img src="starfox_thumb/arwing_mk2_thumb.png" class="btn-logo">
                    <span class="btn-text">ARWING MK II</span>
                </button>

              <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('models/arwing_mk2_b.glb', 'ARWING MK II Retrofit', 'The standard-setting interceptor for Team Star Fox. Features integrated G-Diffuser technology.')">
                    <img src="starfox_thumb/arwing_mk2b_thumb.png" class="btn-logo">
                    <span class="btn-text">ARWING MK II Retrofit</span>
                </button>

                <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('models/arwing_mk3.glb', 'ARWING MK III', 'The standard-setting interceptor for Team Star Fox. Features integrated G-Diffuser technology.')">
                    <img src="starfox_thumb/arwing_mk3_thumb.png" class="btn-logo">
                    <span class="btn-text">ARWING MK III</span>
                </button>
