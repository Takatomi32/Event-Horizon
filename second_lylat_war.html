<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Second Lylat War | Tactical Archive</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="boss-theme-lylat">

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="bosses.html">Boss Database</a></li>
                <li class="active-fleet gold-text">SECOND LYLAT WAR</li>
            </ul>
        </div>
    </nav>

    <div class="fleet-layout">
        <aside class="ship-sidebar gold-border">
            <div class="sidebar-header">
                <h2>SECOND LYLAT WAR BOSSES</h2>
                <div class="status-indicator">TARGET ACTIVE</div>
            </div>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('blade_barrier.glb', 'BLADE BARRIER', 'A massive orbital defense installation. It utilizes rotating kinetic shields and beam-cap emitters to create an impenetrable zone of exclusion.')">
                    <span class="btn-text">BLADE BARRIER</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('attack_carrier.glb', 'ATTACK CARRIER', 'A primary Venomian capital ship capable of atmospheric entry. Featuring integrated hangar bays and heavy missile batteries.')">
                    <span class="btn-text">ATTACK CARRIER</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('meteo_crusher.glb', 'METEO CRUSHER', 'A specialized asteroid-mining unit repurposed for combat. A heavy-duty rotator assembly that acts as both a shield and a weapon.')">
                    <span class="btn-text">METEO CRUSHER</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('shogun_warlord.glb', 'SHOGUN WARLORD', 'An advanced heavy combat walker modified for space-superiority. Features reinforced leg-armor and dual shoulder-mounted particle cannons. Serving as the frontline commander for Venomian ground-to-orbit assaults.')">
                    <span class="btn-text">SHOGUN WARLORD</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('saucerer.glb', 'SAUCERER', 'A dual-layered heavy saucer craft. Utilizes its rotating outer ring to generate a devastating wide-area energy discharge.')">
                    <span class="btn-text">SAUCERER</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('bacoon.glb', 'BACOON', 'A massive bio-mechanical monstrosity encountered in the depths of Aquas. Encased in a pressure-resistant shell, it utilizes powerful tentacles for defense and area-denial.')">
                    <span class="btn-text">BACOON</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('spyborg.glb', 'SPYBORG', 'A gargantuan combat cyborg discovered within the secret research facility at Sector X. Intelligence reports indicate the unit was activated before completion, resulting in erratic behavior and immense physical strength.')">
                    <span class="btn-text">SPYBORG</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('vulcain.glb', 'VULCAIN', 'A legendary bio-mechanical entity residing within the sun, Solar. The Vulcain is capable of withstanding extreme temperatures and utilizes high-energy solar flares as its primary offense.')">
                    <span class="btn-text">VULCAIN</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('sarumarine.glb', 'SARUMARINE', 'A heavy-duty combat submarine responsible for the ecological collapse of Zoness. It features a modular design with a retractable periscope and a heavy-lift crane used to launch debris at interceptors.')">
                    <span class="btn-text">SARUMARINE</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('goras.glb', 'GORAS', 'A colossal bio-mechanical sentinel unearthed from the sands of Titania. The Goras utilizes its massive arms to generate localized sandstorms and physical strikes.')">
                    <span class="btn-text">GORAS</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('scrapworm.glb', 'SCRAPWORM', 'A segmented mechanical parasite that tunnels through the Titania scrap-heaps. The Scrapworm is composed of multiple armored sections, each protecting a sensitive internal core.')">
                    <span class="btn-text">SCRAPWORM</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('monarch_dodora.glb', 'MONARCH DODORA', 'A legendary two-headed avian predator native to the jungles of Fortuna. The Monarch Dodora is highly territorial and utilizes its twin heads to coordinate devastating aerial strikes.')">
                    <span class="btn-text">MONARCH DODORA</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('mechbeth.glb', 'MECHBETH', 'A specialized combat mech deployed from the Macbeth supply train. It utilizes a tether system to maintain high-speed flight relative to the tracks and features modular bay doors for deploying smaller ordinance.')">
                    <span class="btn-text">MECHBETH</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('phantron.glb', 'PHANTRON', 'An advanced stealth interceptor deployed in the deep-space ambush at Sector Z. The Phantron utilizes experimental cloaking and decoy technology, allowing it to create holographic duplicates to confuse enemy targeting systems.')">
                    <span class="btn-text">PHANTRON</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('sarumarine.glb', 'GORGON', 'The ultimate planetary defense station stationed at Area 6. The Gorgon is a modular dreadnought equipped with four massive, semi-autonomous tentacles used for physical area-denial. Its central energy core is protected by heavy folding plates and is capable of firing a system-wide disruption beam.')">
                    <span class="btn-text">GORGON</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('granby.glb', 'GRANBY', 'A massive Venomian dreadnought serving as the flagship of the Space Armada. The Granby is a flying fortress equipped with internal power generators that sustain its heavy shielding.')">
                    <span class="btn-text">GRANBY</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('andross.glb', 'ANDROSS', 'The exiled scientist and self-proclaimed Emperor of the Lylat System. In this initial form, Andross appears as a gargantuan bio-mechanical entity. He utilizes high-energy telekinetic strikes and energy discharges from his eyes.')">
                    <span class="btn-text">ANDROSS</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('andross_brain.glb', 'ANDROSS BRAIN', 'The true form of Andross revealed after the destruction of his mechanical outer shell. This bio-organic brain is the seat of his vast psychic power. It is supported by a series of autonomous tentacles and two independent optic sensors.')">
                    <span class="btn-text">ANDROSS'S BRAIN</span>
                </button>

            <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('super_andross.glb', 'SUPER ANDROSS', 'The final, ascended form of the Venomian Emperor. Beyond the illusions of the mask and the frailty of the organic brain, Super Andross is a perfect synthesis of telekinetic energy and biomechanical engineering. This entity represents a Category-X threat to the Lylat System.')">
                    <span class="btn-text">SUPER ANDROSS</span>
                </button>


            <a href="bosses.html" class="back-btn">« RETURN TO CAMPAIGN MENU</a>
        </aside>

         <main class="viewer-section">
            <model-viewer id="main-display" 
                src="lylat_bosses/blade_barrier.glb" 
                auto-rotate camera-controls 
                shadow-intensity="1" 
                exposure="1.2">
            </model-viewer>

          <div class="ship-description-box">
                <h1 id="ship-name">BLADE BARRIER</h1>
                <p id="ship-desc">A massive orbital defense installation. It utilizes rotating kinetic shields and beam-cap emitters to create an impenetrable zone of exclusion.</p>
            </div>
        </main>
    </div>

    <script>
        function updateModel(fileName, name, desc) {
            const viewer = document.getElementById('main-display');
            viewer.src = `lylat_bosses/${fileName}`;
            document.getElementById('ship-name').innerText = name;
            document.getElementById('ship-desc').innerText = desc;
            
            // Handle active button state
            document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
