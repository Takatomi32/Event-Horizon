<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talan Incident — OST</title>

  <!-- Link to external CSS -->
  <link rel="stylesheet" href="lylat_ost.css">
</head>

<body>

<h1>SECOND LYLAT WAR — OST</h1>
<p class="hint">Click a track to play it</p>

<!-- AUDIO PLAYER + NOW PLAYING -->
<audio id="player" autoplay loop muted></audio>
<div id="nowPlaying" class="now-playing"></div>

<!-- ========================= -->
<!-- LEVEL THEMES SECTION -->
<!-- ========================= -->
<div class="section">
  <h2>Level Themes</h2>

    <!-- LEVEL 1 -->
  <h3>Level 1 — Corneria Orbit</h3>

     <div class="track" onclick="playTrack('ost/lylat_war/corneria_orbit/TalanPort_ThemeA.mp3', 'Level 1 — Intro')">
    Intro
  </div>

 <!-- LEVEL 2 -->
  <h3>Level 2 — Corneria City</h3>

  <div class="track" onclick="playTrack('ost/lylat_war/corneria_orbit/TalanPort_ThemeA.mp3', 'Level 2 — Intro')">
    Intro
  </div>

    <!-- ========================= -->
<!-- BOSS THEMES SECTION -->
<!-- ========================= -->
<div class="section">
  <h2>Boss Themes</h2>

  <div class="track" onclick="playTrack('ost/lylat_war/boss_themes/Boss_1.mp3', 'Boss 1')">
    Boss 1
  </div>

  <div class="track" onclick="playTrack('ost/lylat_war/boss_themes/Boss_2.mp3', 'Boss 2')">
    Boss 2
  </div>

     <div class="track" onclick="playTrack('ost/lylat_war/boss_themes/Boss_3.mp3', 'Boss 3')">
    Boss 3
  </div>

     <div class="track" onclick="playTrack('ost/lylat_war/boss_themes/Boss_3_Spyborg.mp3', 'Boss 3 Spyborg')">
    Boss 3 Spyborg
  </div>

     <div class="track" onclick="playTrack('ost/lylat_war/boss_themes/Boss_4.mp3', 'Boss 4')">
    Boss 4
  </div>
</div>


<!-- BACK BUTTON -->
<div class="back" onclick="window.location.href='../index.html'">
  ⬅ RETURN TO RECORDS
</div>


<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->
<script>
 const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

function playTrack(src, title) {

player.src = src;
  nowPlaying.textContent = "Now Playing: " + title;

  player.volume = 0;
  player.muted = false;

  player.play().then(() => {
    let currentVol = 0;
    const fade = setInterval(() => {
      if (currentVol < 1) {
        currentVol += 0.05;
        if (currentVol > 1) currentVol = 1;
        player.volume = currentVol;
      } else {
        clearInterval(fade);
      }
    }, 50);
  }).catch(error => {
    console.error("Playback failed. This usually happens if the user hasn't clicked anything yet:", error);
  });
}
  
</script>

</body>
</html>
