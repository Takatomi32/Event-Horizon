<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Second Lylat War | Tactical Archive</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="boss-theme-lylat">

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="bosses.html">Boss Database</a></li>
                <li class="active-fleet gold-text">SECOND LYLAT WAR</li>
            </ul>
        </div>
    </nav>

    <div class="fleet-layout">
        <aside class="ship-sidebar gold-border">
            <div class="sidebar-header">
                <h2>TACTICAL DATABASE</h2>
                <div class="status-indicator">TARGETS IDENTIFIED</div>
            </div>

            <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('blade_barrier.glb', 'BLADE BARRIER', 'A massive orbital defense installation. It utilizes rotating kinetic shields and beam-cap emitters to create an impenetrable zone of exclusion.')">
                    <span class="btn-text">BLADE BARRIER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('attack_carrier.glb', 'ATTACK CARRIER', 'A primary Venomian capital ship capable of atmospheric entry. Featuring integrated hangar bays and heavy missile batteries.')">
                    <span class="btn-text">ATTACK CARRIER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('meteo_crusher.glb', 'METEO CRUSHER', 'A specialized asteroid-mining unit repurposed for combat. A heavy-duty rotator assembly that acts as both a shield and a weapon.')">
                    <span class="btn-text">METEO CRUSHER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('shogun_warlord.glb', 'SHOGUN WARLORD', 'An advanced heavy combat walker modified for space-superiority. Features reinforced leg-armor and dual shoulder-mounted particle cannons.')">
                    <span class="btn-text">SHOGUN WARLORD</span>
                </button>

                <button class="ship-btn" onclick="updateModel('saucerer.glb', 'SAUCERER', 'A dual-layered heavy saucer craft. Utilizes its rotating outer ring to generate a devastating wide-area energy discharge.')">
                    <span class="btn-text">SAUCERER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('bacoon.glb', 'BACOON', 'A massive bio-mechanical monstrosity encountered in the depths of Aquas. Encased in a pressure-resistant shell.')">
                    <span class="btn-text">BACOON</span>
                </button>

                <button class="ship-btn" onclick="updateModel('spyborg.glb', 'SPYBORG', 'A gargantuan combat cyborg discovered within the secret research facility at Sector X. Activates with erratic behavior.')">
                    <span class="btn-text">SPYBORG</span>
                </button>

                <button class="ship-btn" onclick="updateModel('vulcain.glb', 'VULCAIN', 'A legendary bio-mechanical entity residing within the sun, Solar. Capable of withstanding extreme temperatures.')">
                    <span class="btn-text">VULCAIN</span>
                </button>

                <button class="ship-btn" onclick="updateModel('sarumarine.glb', 'SARUMARINE', 'A heavy-duty combat submarine responsible for the ecological collapse of Zoness.')">
                    <span class="btn-text">SARUMARINE</span>
                </button>

                <button class="ship-btn" onclick="updateModel('goras.glb', 'GORAS', 'A colossal bio-mechanical sentinel unearthed from the sands of Titania. Uses massive arms for sandstorms.')">
                    <span class="btn-text">GORAS</span>
                </button>

                <button class="ship-btn" onclick="updateModel('scrapworm.glb', 'SCRAPWORM', 'A segmented mechanical parasite that tunnels through the Titania scrap-heaps.')">
                    <span class="btn-text">SCRAPWORM</span>
                </button>

                <button class="ship-btn" onclick="updateModel('monarch_dodora.glb', 'MONARCH DODORA', 'A legendary two-headed avian predator native to the jungles of Fortuna.')">
                    <span class="btn-text">MONARCH DODORA</span>
                </button>

                <button class="ship-btn" onclick="updateModel('mechbeth.glb', 'MECHBETH', 'A specialized combat mech deployed from the Macbeth supply train. Utilizes a tether system.')">
                    <span class="btn-text">MECHBETH</span>
                </button>

                <button class="ship-btn" onclick="updateModel('phantron.glb', 'PHANTRON', 'An advanced stealth interceptor deployed in the deep-space ambush at Sector Z.')">
                    <span class="btn-text">PHANTRON</span>
                </button>

                <button class="ship-btn" onclick="updateModel('gorgon.glb', 'GORGON', 'The ultimate planetary defense station at Area 6. Features semi-autonomous tentacles.')">
                    <span class="btn-text">GORGON</span>
                </button>

                <button class="ship-btn" onclick="updateModel('granby.glb', 'GRANBY', 'A massive Venomian dreadnought serving as the flagship of the Space Armada.')">
                    <span class="btn-text">GRANBY</span>
                </button>

                <button class="ship-btn" onclick="updateModel('andross.glb', 'ANDROSS', 'The self-proclaimed Emperor of the Lylat System. A gargantuan bio-mechanical entity.')">
                    <span class="btn-text">ANDROSS</span>
                </button>

                <button class="ship-btn" onclick="updateModel('andross_brain.glb', 'ANDROSS BRAIN', 'The true form of Andross. A bio-organic brain with vast psychic power.')">
                    <span class="btn-text">ANDROSS BRAIN</span>
                </button>

                <button class="ship-btn" onclick="updateModel('super_andross.glb', 'SUPER ANDROSS', 'The final, ascended form of the Venomian Emperor. A Category-X threat.')">
                    <span class="btn-text">SUPER ANDROSS</span>
                </button>
            </div>

            <a href="bosses.html" class="back-btn">« RETURN TO CAMPAIGN MENU</a>
        </aside>

        <main class="viewer-section">
            <model-viewer id="main-display" 
                src="lylat_bosses/blade_barrier.glb" 
                auto-rotate 
                camera-controls 
                shadow-intensity="2" 
                exposure="1.2"
                environment-image="neutral">
            </model-viewer>

            <div class="ship-description-box">
                <div class="threat-badge">THREAT LEVEL: CRITICAL</div>
                <h1 id="ship-name">BLADE BARRIER</h1>
                <p id="ship-desc">A massive orbital defense installation. It utilizes rotating kinetic shields and beam-cap emitters to create an impenetrable zone of exclusion.</p>
            </div>
        </main>
    </div>

    <script>
        function updateModel(fileName, name, desc) {
            const viewer = document.getElementById('main-display');
            viewer.src = `lylat_bosses/${fileName}`;
            document.getElementById('ship-name').innerText = name;
            document.getElementById('ship-desc').innerText = desc;
            
            // Handle active button state
            document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Change threat badge for final bosses
            const badge = document.querySelector('.threat-badge');
            if(name.includes("ANDROSS")) {
                badge.innerText = "THREAT LEVEL: CATEGORY-X";
                badge.style.color = "#ff4d4d";
                badge.style.borderColor = "#ff4d4d";
            } else {
                badge.innerText = "THREAT LEVEL: CRITICAL";
                badge.style.color = "#f1c40f";
                badge.style.borderColor = "#f1c40f";
            }
        }
    </script>
</body>
</html>
