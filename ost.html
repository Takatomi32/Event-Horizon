<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Horizon OST Menu</title>

 <style>
    @font-face {
      font-family: "Orbitron";
      src: url("fonts/Orbitron-Regular.ttf");
    }

    body {
      background: #000;
      color: #fff;
      font-family: Orbitron, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .record {
      margin: 25px 0;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .record-number {
      font-size: 22px;
      opacity: 0.6;
      letter-spacing: 2px;
    }

    .record-title {
      font-size: 32px;
      margin-top: 5px;
      letter-spacing: 3px;
    }

    .record:hover {
      transform: scale(1.05);
      text-shadow: 0 0 12px #4fc3ff;
    }
  </style>
</head>
  
<body>

  <div class="record" onclick="openCampaign('lylat_ost')">
    <div class="record-number">RECORD 01</div>
    <div class="record-title">SECOND LYLAT WAR</div>
  </div>

  <div class="record" onclick="openCampaign('sauria_ost')">
    <div class="record-number">RECORD 02</div>
    <div class="record-title">SAURIA CRISIS</div>
  </div>

  <div class="record" onclick="openCampaign('talan_ost')">
    <div class="record-number">RECORD 03</div>
    <div class="record-title">TALAN INCIDENT</div>
  </div>

  <script>
    function openCampaign(id) {
      // Later this will load the OST list for that campaign
      console.log("Selected:", id);
    }
  </script>

</body>
</html>
