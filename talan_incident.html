<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Talan Incident | Tactical Archive</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="boss-theme-talan">

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="bosses.html">Boss Database</a></li>
                <li class="active-fleet gold-text">TALAN INCIDENT</li>
            </ul>
        </div>
    </nav>

    <div class="fleet-layout">
        <aside class="ship-sidebar gold-border">
            <div class="sidebar-header">
                <h2>TACTICAL DATABASE</h2>
                <div class="status-indicator">TARGETS IDENTIFIED</div>
            </div>

                <div class="ship-list">
            <button class="ship-btn" onclick="updateModel('heavy_carrier.glb', 'HEAVY CARRIER', 'The pride of the CDF fleet. During the Talan Incident, these vessels transitioned from peacekeepers to primary aggressors.')">
                    <span class="btn-text">HEAVY CARRIER</span>
                </button>

            <button class="ship-btn" onclick="updateModel('mirage_dragon.glb', 'MIRAGE DRAGON', 'A specialized bio-mechanical interceptor. Its refractive hull allows it to ambush targets within the Talan nebulae.')">
                    <span class="btn-text">MIRAGE DRAGON</span>
                </button>

            <button class="ship-btn" onclick="updateModel('tektron.glb', 'TEKTRON', 'An autonomous AI sentinel activated to enforce the Cornerian blockade. It possesses adaptive combat logic.')">
                    <span class="btn-text">TEKTRON</span>
                </button>
                    
            <a href="bosses.html" class="back-btn">«RETURN TO CAMPAIGN MENU</a>
        </aside>

        <main class="viewer-section">
            <model-viewer id="main-display" 
                src="talan_bosses/heavy_carrier.glb" 
                auto-rotate camera-controls 
                shadow-intensity="1" 
                exposure="1.2">
            </model-viewer>

            <div class="ship-description-box">
                <h1 id="ship-name">HEAVY CARRIER</h1>
                <p id="ship-desc">The pride of the CDF fleet. During the Talan Incident, these vessels transitioned from peacekeepers to primary aggressors.</p>
            </div>
        </main>
    </div>

    <script>
     function updateModel(fileName, name, desc) {
    const viewer = document.getElementById('main-display');
    const badge = document.querySelector('.threat-badge');
    const nameElement = document.getElementById('ship-name');
    const descElement = document.getElementById('ship-desc');

    // 1. Update Model and Text
    viewer.src = `talan_bosses/${fileName}`;
    nameElement.innerText = name;
    descElement.innerText = desc;
    
    // 2. Handle UI Active State (Fixed 'event' reference)
    document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('active'));
    if (window.event) {
        window.event.currentTarget.classList.add('active');
    }

    // 3. Logic for Sauria Threat Levels
    // Using a switch makes it easier to add "Category-X" bosses later
    switch (name) {
        case "GENERAL PEPPER":
        case "COLONEL SHEARS":
            badge.innerText = "THREAT LEVEL: CATEGORY-X";
            badge.style.color = "#ff4d4d"; // Aggressive Red
            badge.style.borderColor = "#ff4d4d";
            break;
        
        default:
            badge.innerText = "THREAT LEVEL: CRITICAL";
            badge.style.color = "#2ecc71"; // Sauria Green
            badge.style.borderColor = "#2ecc71";
            break;
    }
}
    </script>

</body>
</html>
