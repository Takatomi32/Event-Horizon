<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talan Incident — OST</title>

  <link rel="stylesheet" href="talan_ost.css">
</head>

<body>

<h1>TALAN INCIDENT — OST</h1>
<p class="hint">Click a track to play it (audio fades in)</p>

<!-- ========================= -->
<!-- AUDIO PLAYER -->
<!-- ========================= -->

<audio id="player"></audio>

<!-- AUDIO CONTROLS -->
<div class="audio-controls">
  <button class="audio-btn" onclick="playCurrent()">▶ PLAY</button>
  <button class="audio-btn" onclick="pauseTrack()">⏸ PAUSE</button>
  <button class="audio-btn" onclick="stopTrack()">⏹ STOP</button>

  <div class="progress-container" onclick="seekTrack(event)">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="time-display">
    <span id="currentTime">00:00</span> /
    <span id="duration">00:00</span>
  </div>
</div>

<div id="nowPlaying" class="now-playing"></div>

<!-- ========================= -->
<!-- LEVEL THEMES SECTION -->
<!-- ========================= -->

<div class="section">
  <h2>Level Themes</h2>

 <h3>Yume Moon</h3>
  <div class="track" onclick="playTrack('ost/sauria_crisis/yume_moon/begin_mission.ogg', 'Star Fox Begin Mission')">
    Begin Mission
  </div>

  <div class="track" onclick="playTrack('ost/sauria_crisis/yume_moon/rescue.ogg', 'Star Fox Rescue')">
    Rescue
  </div>

  <div class="track" onclick="playTrack('ost/sauria_crisis/yume_moon/rescue_short.ogg', 'Star Fox Rescue Short')">
    Rescue Short
  </div>

  <div class="track" onclick="playTrack('ost/sauria_crisis/yume_moon/marching.ogg', 'Star Fox Marching')">
    Marching
  </div>
</div>

<!-- ========================= -->
<!-- BOSS THEMES SECTION -->
<!-- ========================= -->

<div class="section">
  <h2>Boss Themes</h2>


</div>

<!-- BACK BUTTON -->
<div class="back" onclick="window.location.href='../index.html'">
  ⬅ RETURN TO RECORDS
</div>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

let currentTrack = "";

/* PLAY TRACK WITH FADE-IN */
function playTrack(src, title) {
  player.src = src;
  currentTrack = src;
  nowPlaying.textContent = "Now Playing: " + title;

  player.volume = 0;
  player.play();

  let vol = 0;
  const fade = setInterval(() => {
    vol += 0.05;
    if (vol >= 1) {
      vol = 1;
      clearInterval(fade);
    }
    player.volume = vol;
  }, 50);
}

/* BUTTON CONTROLS */
function playCurrent() {
  if (currentTrack !== "") player.play();
}

function pauseTrack() {
  player.pause();
}

function stopTrack() {
  player.pause();
  player.currentTime = 0;
}

/* PROGRESS BAR + TIME */
player.addEventListener("timeupdate", () => {
  const progress = (player.currentTime / player.duration) * 100;
  document.getElementById("progressBar").style.width = progress + "%";

  document.getElementById("currentTime").textContent = formatTime(player.currentTime);
  document.getElementById("duration").textContent = formatTime(player.duration);
});

function seekTrack(event) {
  const rect = event.target.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const percent = x / rect.width;
  player.currentTime = percent * player.duration;
}

function formatTime(sec) {
  if (isNaN(sec)) return "00:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
}
</script>

</body>
</html>
