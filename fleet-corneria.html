<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cornerian Army Fleet | Event Horizon</title>
    <link rel="stylesheet" href="cornerian_army.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>

<body class="fleet-page">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="models.html">Hangar</a></li>
                <li class="active-fleet">CORNERIAN ARMY FLEET</li>
            </ul>
        </div>
    </nav>

    <!-- MAIN LAYOUT -->
    <div class="fleet-layout">

        <!-- SIDEBAR -->
        <aside class="ship-sidebar">
            <div class="sidebar-header">
                <h2>CORNERIAN ARMY FLEET</h2>
            </div>

            <div class="ship-list">

                <button class="ship-btn active" onclick="updateModel('battleship.glb','CORNERIAN BATTLESHIP','A heavy dreadnought-class warship used by the Cornerian Army.', this)">
                    <span class="btn-text">CORNERIAN BATTLESHIP</span>
                </button>

                <button class="ship-btn" onclick="updateModel('cruiser.glb','CORNERIAN CRUISER','The backbone of the CDF fleet. A versatile multi-purpose vessel.', this)">
                    <span class="btn-text">CORNERIAN CRUISER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('frigate.glb','CORNERIAN FRIGATE','A dedicated escort vessel equipped with advanced tracking systems.', this)">
                    <span class="btn-text">CORNERIAN FRIGATE</span>
                </button>

                <button class="ship-btn" onclick="updateModel('freighter.glb','CORNERIAN FREIGHTER','A high‑capacity cargo vessel built for interstellar logistics.', this)">
                    <span class="btn-text">CORNERIAN FREIGHTER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('transport.glb','CORNERIAN TRANSPORT','A tactical personnel carrier built for atmospheric re-entry and rapid deployment.', this)">
                    <span class="btn-text">CORNERIAN TRANSPORT</span>
                </button>

                <button class="ship-btn" onclick="updateModel('beam_tank.glb','CORNERIAN BEAM TANK','A heavy artillery platform equipped with a high‑output particle cannon.', this)">
                    <span class="btn-text">CORNERIAN BEAM TANK</span>
                </button>

                <button class="ship-btn" onclick="updateModel('tank.glb','CORNERIAN TANK','A heavy armored unit delivering devastating ground‑based firepower.', this)">
                    <span class="btn-text">CORNERIAN TANK</span>
                </button>

                <button class="ship-btn" onclick="updateModel('navy_battleship.glb','NAVY BATTLESHIP','A naval dreadnought designed for orbital and atmospheric operations.', this)">
                    <span class="btn-text">NAVY BATTLESHIP</span>
                </button>

                <button class="ship-btn" onclick="updateModel('navy_corvette.glb','NAVY CORVETTE','A fast‑response escort vessel used by the Cornerian Navy.', this)">
                    <span class="btn-text">NAVY CORVETTE</span>
                </button>

                <button class="ship-btn" onclick="updateModel('navy_cruiser.glb','NAVY CRUISER','A mid‑class warship balancing firepower and mobility.', this)">
                    <span class="btn-text">NAVY CRUISER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('fighter.glb','CORNERIAN FIGHTER','A dependable interceptor forming the backbone of aerial defense.', this)">
                    <span class="btn-text">CORNERIAN FIGHTER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('bill_fighter.glb','BILL’S FIGHTER','A specialized fighter for Bill Grey of the Bulldog Squadron.', this)">
                    <span class="btn-text">BILL’S FIGHTER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('battleship_x02.glb','BATTLESHIP X02','An experimental assault vessel built for speed and precision.', this)">
                    <span class="btn-text">BATTLESHIP X02</span>
                </button>

                <button class="ship-btn" onclick="updateModel('cruiser_x02.glb','CRUISER X02','A next‑generation strike vessel built on the X‑Series chassis.', this)">
                    <span class="btn-text">CRUISER X02</span>
                </button>

                <button class="ship-btn" onclick="updateModel('troopship_x02.glb','TROOPSHIP X02','A high‑durability assault lander with experimental stealth plating.', this)">
                    <span class="btn-text">TROOPSHIP X02</span>
                </button>

                <button class="ship-btn" onclick="updateModel('bomber.glb','CORNERIAN BOMBER','Designed to eliminate fortified structures and capital ships.', this)">
                    <span class="btn-text">CORNERIAN BOMBER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('drone_carrier.glb','DRONE CARRIER','Deploys automated interceptors to overwhelm enemy targets.', this)">
                    <span class="btn-text">DRONE CARRIER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('drone_fighter.glb','DRONE FIGHTER','A high‑agility starfighter deployed in vast swarms.', this)">
                    <span class="btn-text">DRONE FIGHTER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('artillery_tank.glb','ARTILLERY TANK','Used to lock down choke points and shatter fortifications.', this)">
                    <span class="btn-text">ARTILLERY TANK</span>
                </button>

                <button class="ship-btn" onclick="updateModel('vtol.glb','VTOL DROPSHIP','Deploys infantry and equipment directly into combat zones.', this)">
                    <span class="btn-text">VTOL DROPSHIP</span>
                </button>

            </div>

            <a href="models.html" class="back-btn">« RETURN TO HANGAR</a>
        </aside>

        <!-- VIEWER SECTION -->
        <main class="viewer-section">

            <model-viewer id="main-display"
                src="cornerian_models/battleship.glb"
                auto-rotate
                camera-controls
                shadow-intensity="1"
                exposure="1.2"
                style="z-index: 1;">
            </model-viewer>

            <div class="ship-description-box">
                <h1 id="ship-name">CORNERIAN BATTLESHIP</h1>
                <p id="ship-desc">A heavy dreadnought-class warship used by the Cornerian Army.</p>
            </div>

        </main>

    </div>

    <!-- SCRIPT -->
    <script>
        function updateModel(fileName, name, desc, btn) {
            const viewer = document.getElementById('main-display');
            viewer.src = `cornerian_models/${fileName}`;

            document.getElementById('ship-name').innerText = name;
            document.getElementById('ship-desc').innerText = desc;

            document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
