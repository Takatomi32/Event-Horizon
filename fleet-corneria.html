<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cornerian Fleet | Event Horizon</title>
    <link rel="stylesheet" href="cornerian_army.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="fleet-page">

  <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="models.html">Hangar</a></li>
                <li class="active-fleet">Cornerian Fleet</li>
            </ul>
        </div>
    </nav>

  <div class="fleet-layout">
        <aside class="ship-sidebar">
            <div class="sidebar-header">
                <h2>Cornerian Army Fleet</h2>
            </div>

          <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('battleship.glb', 'Cornerian Battleship', 'The primary capital ship of the CDF fleet. Known for its massive profile and heavy engine pods.')">
                    <span class="btn-text">Cornerian Battleship</span>
                </button>

            <a href="models.html" class="back-btn">« RETURN TO HANGAR</a>
              </aside>

      <main class="viewer-section">
            <model-viewer id="main-display" 
                src="cornerian_models/battleship.glb" 
                auto-rotate camera-controls 
                shadow-intensity="1" 
                exposure="1.2">
            </model-viewer>

          <div class="ship-description-box">
                <h1 id="ship-name">Cornerian Battleship</h1>
                <p id="ship-desc">The primary capital ship of the CDF fleet. Known for its massive profile and heavy engine pods.</p>
            </div>
        </main>
    </div>

  <script>
        function updateModel(fileName, name, desc) {
            const viewer = document.getElementById('main-display');
            viewer.src = `cornerian_models/${fileName}`;
            document.getElementById('ship-name').innerText = name;
            document.getElementById('ship-desc').innerText = desc;
            
            // Handle active button state
            document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
