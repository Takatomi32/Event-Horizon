<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cornerian Army Fleet | Event Horizon</title>
    <link rel="stylesheet" href="cornerian_army.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>

<body class="fleet-page">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="models.html">Hangar</a></li>
                <li class="active-fleet">CORNERIAN ARMY FLEET</li>
            </ul>
        </div>
    </nav>

    <!-- MAIN LAYOUT -->
    <div class="fleet-layout">

        <!-- SIDEBAR -->
        <aside class="ship-sidebar">
            <div class="sidebar-header">
                <h2>CORNERIAN ARMY FLEET</h2>
            </div>

            <div class="ship-list">

                <button class="ship-btn active" onclick="updateModel('battleship.glb','CORNERIAN BATTLESHIP','A heavy dreadnought-class warship used by the Cornerian Army.', this)">
                    <span class="btn-text">CORNERIAN BATTLESHIP</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('cruiser.glb','CORNERIAN BATTLESHIP','The backbone of the CDF fleet. A versatile multi-purpose vessel.', this)">
                    <span class="btn-text">CORNERIAN CRUISER</span>
                </button>

                 <button class="ship-btn active" onclick="updateModel('frigate.glb','CORNERIAN FRIGATE','A dedicated escort vessel equipped with advanced tracking systems.', this)">
                    <span class="btn-text">CORNERIAN FRIGATE</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('frigate.glb','CORNERIAN FREIGHTER','The backbone of the Lylat interstellar trade. Built for volume over speed.', this)">
                    <span class="btn-text">CORNERIAN FREIGHTER</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('transport.glb','CORNERIAN TRANSPORT','A tactical personnel carrier built for atmospheric re-entry and rapid deployment.', this)">
                    <span class="btn-text">CORNERIAN TRANSPORT</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('beam_tank.glb','CORNERIAN BEAM TANK','A heavy ground-based artillery unit equipped with a high-output particle cannon.', this)">
                    <span class="btn-text">CORNERIAN BEAM TANK</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('tank.glb','CORNERIAN TANK','backbone of Cornerian planetary defense, this heavy armored unit delivers devastating ground-based firepower.', this)">
                    <span class="btn-text">CORNERIAN TANK</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('navy_battleship.glb','CORNERIAN NAVY BATTLESHIP','A heavy ground-based artillery unit equipped with a high-output particle cannon.', this)">
                    <span class="btn-text">CORNERIAN NAVY BATTLESHIP</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('navy_corvette.glb','CORNERIAN NAVY CORVETTE','A heavy ground-based artillery unit equipped with a high-output particle cannon.', this)">
                    <span class="btn-text">CORNERIAN NAVY CORVETTE</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('navy_cruiser.glb','CORNERIAN NAVY CRUISER','A heavy ground-based artillery unit equipped with a high-output particle cannon.', this)">
                    <span class="btn-text">CORNERIAN NAVY CRUISER</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('fighter.glb','CORNERIAN NAVY CRUISER','A form of the backbone of the aerial defense grid, and ease of maintenance make it a dependable interceptor against planetary incursions.', this)">
                    <span class="btn-text">CORNERIAN FIGHTER</span>
                </button>
                
                <button class="ship-btn active" onclick="updateModel('bill_fighter.glb','CORNERIAN BILL FLIGHTER','A specalized fighter for Bill, leader of the bulldog squadron.', this)">
                    <span class="btn-text">CORNERIAN BILL'S FIGHTER</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('battleship_x02.glb','CORNERIAN BATTLESHIP X02','An experimental assault vessel built for speed and precision using a high-output G-Diffuser.', this)">
                    <span class="btn-text">CORNERIAN BATTLESHIP X02</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('cruiser_x02.glb','CORNERIAN CRUISER X02','A next-generation strike vessel built on the X-Series chassis.', this)">
                    <span class="btn-text">CORNERIAN CRUISER X02</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('troopship_x02.glb','CORNERIAN TROOPSHIP X02','The Vanguard-class is a high-durability assault lander with experimental stealth-plating.', this)">
                    <span class="btn-text">CORNERIAN TROOPSHIP X02</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('bomber.glb','CORNERIAN BOMBER','Deployed to eliminate fortified surface structures, enemy capital ships, and heavy ground installations.', this)">
                    <span class="btn-text">CORNERIAN BOMBER</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('drone_carrier.glb','CORNERIAN DRONE CARRIER','Stays behind the frontlines, saturating the combat airspace with automated interceptors to overwhelm enemy targets.', this)">
                    <span class="btn-text">CORNERIAN DRONE CARRIER</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('drone_fighter.glb','CORNERIAN DRONE FIGHTER','A high-agility starfighter deployed in vast swarms from Drone Carriers.', this)">
                    <span class="btn-text">CORNERIAN DRONE FIGHTER</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('artillery_tank.glb','CORNERIAN ARTILLERY TANK','Deployed to lock down choke points, shatter enemy fortifications, and provide cover fire for advancing infantry and armor divisions.', this)">
                    <span class="btn-text">CORNERIAN ARTILLERY TANK</span>
                </button>

                <button class="ship-btn active" onclick="updateModel('vtol.glb','CORNERIAN VTOL DROPSHIP','Drop infantry divisions, deploy tactical equipment, or perform medical evacuations directly into active combat zones.', this)">
                    <span class="btn-text">CORNERIAN VTOL DROPSHIP</span>
                </button>

            </div>

            <a href="models.html" class="back-btn">« RETURN TO HANGAR</a>
        </aside>

        <!-- VIEWER SECTION -->
        <main class="viewer-section">

            <model-viewer id="main-display"
                src="cornerian_models/battleship.glb"
                auto-rotate
                camera-controls
                shadow-intensity="1"
                exposure="1.2"
                style="z-index: 1;">
            </model-viewer>

            <div class="ship-description-box">
                <h1 id="ship-name">CORNERIAN BATTLESHIP</h1>
                <p id="ship-desc">A heavy dreadnought-class warship used by the Cornerian Army.</p>
            </div>

        </main>

    </div>

    <!-- SCRIPT -->
    <script>
        function updateModel(fileName, name, desc, btn) {
            const viewer = document.getElementById('main-display');
            viewer.src = `sf_models/${fileName}`;

            document.getElementById('ship-name').innerText = name;
            document.getElementById('ship-desc').innerText = desc;

            document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
