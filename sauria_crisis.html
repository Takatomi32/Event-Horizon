<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sauria Crisis | Tactical Archive</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="boss-theme-sauria">

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="bosses.html">Boss Database</a></li>
                <li class="active-fleet gold-text">SAURIA CRISIS</li>
            </ul>
        </div>
    </nav>

    <div class="fleet-layout">
        <aside class="ship-sidebar gold-border">
            <div class="sidebar-header">
                <h2>TACTICAL DATABASE</h2>
                <div class="status-indicator">TARGETS IDENTIFIED</div>
            </div>

            <div class="ship-list">
                <button class="ship-btn active" onclick="updateModel('maximus.glb', 'MAXIMUS', 'A colossal bio-mechanical predator reconstructed through SharpClaw alchemy and Venomian tech.')">
                    <span class="btn-text">MAXIMUS</span>
                </button>

                <button class="ship-btn" onclick="updateModel('captain_cobold.glb', 'CAPTAIN COBOLD', 'Commander of the pirate fleet currently occupying the Saurian stratosphere. Utilizing a heavily modified interceptor with experimental shielding.')">
                    <span class="btn-text">CAPTAIN COBOLD</span>
                </button>

                <button class="ship-btn" onclick="updateModel('scorpion_mech.glb', 'SCORPION MECH', 'An automated heavy-combat walker deployed by SharpClaw engineers. Featuring a high-velocity stinger cannon and reinforced hydraulic pincers.')">
                    <span class="btn-text">SCORPION MECH</span>
                </button>

                <button class="ship-btn" onclick="updateModel('zeppelin_rex.glb', 'ZEPPELIN REX', 'A massive SharpClaw air-dreadnought fused with experimental bio-organic propulsion. It serves as the command center for the airborne occupation of Sauria.')">
                    <span class="btn-text">ZEPPELIN REX</span>
                </button>

                <button class="ship-btn" onclick="updateModel('stone_sentinel.glb', 'STONE SENTINEL', 'An ancient lithic construct serving as a permanent guardian of the Saurian temples. Powered by raw SpellStone resonance, it is immune to most energy-based weaponry.')">
                    <span class="btn-text">STONE SENTINEL</span>
                </button>

                <button class="ship-btn" onclick="updateModel('phantom_squid.glb', 'PHANTOM SQUID', 'An elusive bio-mechanical cephalopod designed for multi-environment combat. Hidden inside the Stone Sentinel.')">
                    <span class="btn-text">PHANTOM SQUID</span>
                </button>

                <button class="ship-btn" onclick="updateModel('arborabom.glb', 'ARBOR ABOMINATION', 'A catastrophic bio-plant. The Arbor abomination is a sentient, multi-limbed plant entity integrated with heavy artillery and kinetic shielding.')">
                    <span class="btn-text">ARBOR ABOMINATION</span>
                </button>

                <button class="ship-btn" onclick="updateModel('dimechadon.glb', 'DIMECHADON', 'A highly agile mechanical predator specialized in pursuit and suppression. The Dimechadon utilizes a thermal-tracking neural link and high-frequency vibro-blades along its dorsal fin.')">
                    <span class="btn-text">DIMECHADON</span>
                </button>

                <button class="ship-btn" onclick="updateModel('deathglider.glb', 'DEATHGLIDER', 'An elite high-altitude interceptor utilized for rapid-response atmospheric defense. The Deathglider features twin-linked plasma repeaters and a specialized nanite-repair hull.')">
                    <span class="btn-text">DEATHGLIDER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('totemlord.glb', 'TOTEMLORD', 'An immense, modular stone construct animated by concentrated SpellStone energy. The Totemlord consists of several rotating segments, each outfitted with unique weapon systems ranging from shockwave emitters to rapid-fire plasma turrets.')">
                    <span class="btn-text">TOTEMLORD</span>
                </button>

                <button class="ship-btn" onclick="updateModel('saurslayer.glb', 'SAURSLAYER', 'The pinnacle of SharpClaw heavy-armor engineering. The Saurslayer is a massive bipedal combat walker equipped with dual plasma-repeaters and a tail-mounted seismic resonator.')">
                    <span class="btn-text">SAURSLAYER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('triloknight.glb', 'TRILOKNIGHT', 'A heavily armored, multi-legged siege walker designed for breakthrough operations. The Triloknight features a low-profile chassis that is resistant to heavy bombardment. It is equipped with underside-mounted plasma cutters and a dorsal mortar system for long-range suppression.')">
                    <span class="btn-text">TRILOKNIGHT</span>
                </button>

                <button class="ship-btn" onclick="updateModel('galdon.glb', 'GALDON', 'A massive bio-mutant with a heavily armored carapace. Galdon serves as a primary guardian of the SpellStones. It is capable of swallowing targets whole and utilizing a high-voltage tail stinger for area denial.')">
                    <span class="btn-text">GALDON</span>
                </button>

                <button class="ship-btn" onclick="updateModel('broodmother.glb', 'BROODMOTHER', 'The supreme matriarch of the Saurian insectoid swarms, heavily mutated by Venomian bio-matter. The Broodmother serves as a biological factory, producing specialized drones at an alarming rate.')">
                    <span class="btn-text">BROODMOTHER</span>
                </button>

                <button class="ship-btn" onclick="updateModel('throne_drone.glb', 'THRONE DRONE', 'An advanced autonomous defense platform deployed to protect high-priority SharpClaw personnel. The Throne Drone is equipped with a localized kinetic bubble shield and a 360-degree rapid-fire plasma turret.')">
                    <span class="btn-text">THRONE DRONE</span>
                </button>

                <button class="ship-btn" onclick="updateModel('chimera_1.glb', 'CHIMERA 1', 'A dead fossil rose back from the dead. Combining the raw power of a Greater Saurian with the regenerative capabilities.')">
                    <span class="btn-text">CHIMERA</span>
                </button>

                <button class="ship-btn" onclick="updateModel('redeye_king.glb', 'REDEYE KING', 'The colossal leader of the Redeye tribe. The Redeye King is a massive, carnivorous theropod. While physically invulnerable to standard weaponry, he is extremely sensitive to high-intensity lighting.')">
                    <span class="btn-text">REDEYE KING</span>
                </button>

                <button class="ship-btn" onclick="updateModel('gyrofort.glb', 'GYROFORT', 'A massive, gyroscopically stabilized aerial fortress. The Gyrofort serves as the primary command-and-control center for the SharpClaw atmospheric fleet. It is equipped with heavy-duty fan thrusters for VTOL capabilities and an array of underside railguns designed to saturate ground targets from high altitude.')">
                    <span class="btn-text">GYROFORT</span>
                </button>

                <button class="ship-btn" onclick="updateModel('zeram_mk2.glb', 'ZERAM MK2', 'A second-generation bio-mechanical combatant designed for absolute aerial and ground dominance. The Zeram MK2 features integrated thruster arrays for hyper-mobility and a dual-phase energy core. Unlike its predecessor, the MK2 possesses a rudimentary tactical AI, allowing it to predict and parry incoming Arwing fire.')">
                    <span class="btn-text">ZERAM MK2</span>
                </button>

                <button class="ship-btn" onclick="updateModel('galleon.glb', 'GALLEON', 'A heavy-duty SharpClaw battleship designed for maritime and low-altitude coastal dominance. The Galleon features reinforced hull plating capable of withstanding intense fire from the dragon and is outfitted with broadside plasma cannons.')">
                    <span class="btn-text">GALLEON</span>
                </button>

                <button class="ship-btn" onclick="updateModel('kamerian_heart.glb', 'KAMERIAN HEART', 'A primordial bio-synthetic energy core of unknown origin. The Kamerian Heart acts as a central nervous system for localized planetary corruption. It defends itself by emitting rhythmic bursts of concentrated plasma and manipulating the gravity wells within its immediate vicinity.')">
                    <span class="btn-text">KAMERIAN HEART</span>
                </button>

                <button class="ship-btn" onclick="updateModel('drakor.glb', 'DRAKOR', 'An advanced avian-class combat mechanoid. Drakor is equipped with dual-wing plasma casters and a high-yield thermal core. Designed for air-to-air superiority, it can execute complex maneuvers that outpace standard Arwing tracking systems.')">
                    <span class="btn-text">DRAKOR</span>
                </button>

                <button class="ship-btn" onclick="updateModel('dark_drakor.glb', 'DARK MATTER DRAKOR', 'The ascended second phase of Drakor. After sustaining critical damage, the unit sheds its safety limiters, exposing a core saturated with Dark Matter energy. Dark Drakor exhibits near-teleportation speeds and utilizes devastating void-beam attacks.')">
                    <span class="btn-text">DARK MATTER DRAKOR</span>
                </button>
            </div>

            <a href="bosses.html" class="back-btn">« RETURN TO CAMPAIGN MENU</a>
        </aside>

        <main class="viewer-section">
            <model-viewer id="main-display" 
                src="sauria_bosses/maximus.glb" 
                auto-rotate 
                camera-controls 
                shadow-intensity="2" 
                exposure="1.2"
                environment-image="neutral">
            </model-viewer>

            <div class="ship-description-box">
                <div class="threat-badge">THREAT LEVEL: CRITICAL</div>
                <h1 id="ship-name">MAXIMUS</h1>
                <p id="ship-desc">A colossal bio-mechanical predator reconstructed through SharpClaw alchemy and Venomian tech.</p>
            </div>
        </main>
    </div>

    <script>
     function updateModel(fileName, name, desc) {
    const viewer = document.getElementById('main-display');
    const badge = document.querySelector('.threat-badge');
    const nameElement = document.getElementById('ship-name');
    const descElement = document.getElementById('ship-desc');

    // 1. Update Model and Text
    viewer.src = `sauria_bosses/${fileName}`;
    nameElement.innerText = name;
    descElement.innerText = desc;
    
    // 2. Handle UI Active State (Fixed 'event' reference)
    document.querySelectorAll('.ship-btn').forEach(btn => btn.classList.remove('active'));
    if (window.event) {
        window.event.currentTarget.classList.add('active');
    }

    // 3. Logic for Sauria Threat Levels
    // Using a switch makes it easier to add "Category-X" bosses later
    switch (name) {
        case "GALDON":
        case "REDEYE KING":
        case "ZERAM MK2":
        case "GALLEON":
        case "KAMERIAN HEART":
        case "DRAKOR":
        case "DARK MATTER DRAKOR":
            badge.innerText = "THREAT LEVEL: CATEGORY-X";
            badge.style.color = "#ff4d4d"; // Aggressive Red
            badge.style.borderColor = "#ff4d4d";
            break;
        
        default:
            badge.innerText = "THREAT LEVEL: CRITICAL";
            badge.style.color = "#2ecc71"; // Sauria Green
            badge.style.borderColor = "#2ecc71";
            break;
    }
}
    </script>
</body>
</html>
